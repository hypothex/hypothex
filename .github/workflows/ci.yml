name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups
      # the bootstrap tests install the wheel offline with `uv tool install`; `uv sync`
      # installs from the lockfile and caches no index pages, so resolve once online here
      - name: Warm the uv cache for offline tool installs
        run: uv tool install --python ${{ matrix.python }} .
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src
      - run: uv run pytest -q
      - run: uv run sphinx-build -W -b html docs docs/_build/html

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install Python package
        working-directory: .
        run: uv sync
      - name: Install UI dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Type-check e2e
        run: bunx tsc -p e2e/tsconfig.json
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: bunx playwright test
      - name: Demo shutdown check
        run: bun e2e/shutdown-check.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/e2e/.report
            ui/e2e/.results
          retention-days: 7

  docker:
    # tests/docker: a throwaway sshd container and a small SLURM cluster (never real hosts)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPOTHEX_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - run: docker version && docker compose version
      - run: uv run pytest -m docker -v -rs --durations=10

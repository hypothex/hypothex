<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypothex, uspto-forward-top1</title>
<script>
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q || localStorage.getItem("hx-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  --paper: #F6F7F3;
  --paper-2: #ECEEE8;
  --ink: #15181E;
  --ink-2: #464C57;
  --ink-3: #767C87;
  --rule: #D5D8D0;
  --rule-2: #E4E6E0;
  --best: #00846A;
  --best-wash: rgba(0, 132, 106, .12);
  --best-edge: rgba(0, 132, 106, .50);
  --fail: #C8412B;
  --agent: #5B48C2;
  --human: #A66A12;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
[data-theme="dark"] {
  --paper: #12161C;
  --paper-2: #1A1F27;
  --ink: #E9ECEF;
  --ink-2: #AEB5BF;
  --ink-3: #7C8490;
  --rule: #2C333D;
  --rule-2: #222830;
  --best: #1FA282;
  --best-wash: rgba(31, 162, 130, .17);
  --best-edge: rgba(31, 162, 130, .60);
  --fail: #DE5F49;
  --agent: #8C7BEA;
  --human: #C08629;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  font-feature-settings: "ss01" 0;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.path, code, kbd { font-family: var(--mono); font-size: .86em; }

/* ------------------------------------------------------------------ chrome */
.bar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.bar-in { max-width: 1280px; margin: 0 auto; padding: 0 40px; height: 60px; display: flex; align-items: stretch; gap: 40px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 600 21px/1 var(--serif); letter-spacing: -.01em; }
.brand svg { display: block; }
.tabs { display: flex; gap: 4px; }
.tabs a {
  display: flex; align-items: center; padding: 0 12px; text-decoration: none; color: var(--ink-3);
  font-size: 14.5px; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.bar-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.find {
  display: flex; align-items: center; gap: 28px; height: 34px; padding: 0 8px 0 12px; min-width: 250px;
  border: 1px solid var(--rule); border-radius: 7px; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 13.5px;
}
.find:hover { border-color: var(--ink-3); }
.find kbd { margin-left: auto; font-family: var(--sans); font-size: 12px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }
.theme { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 7px; background: transparent; cursor: pointer; font-size: 13.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.theme:hover { border-color: var(--ink-3); color: var(--ink); }

main { max-width: 1280px; margin: 0 auto; padding: 44px 40px 120px; }
.view[hidden] { display: none; }

/* ------------------------------------------------------------------ type */
.crumb { margin: 0 0 18px; font-size: 13.5px; color: var(--ink-3); }
.crumb a { color: var(--ink-2); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.crumb .sep { margin: 0 6px; color: var(--rule); }
h1.finding {
  margin: 0; max-width: 21em;
  font: 500 46px/1.06 var(--serif); font-variation-settings: "opsz" 72;
  letter-spacing: -.018em; text-wrap: balance;
}
h1.finding .then { color: var(--ink-2); font-weight: 400; }
.lede { margin: 18px 0 0; max-width: 64ch; font: 400 19.5px/1.5 var(--serif); font-variation-settings: "opsz" 16; color: var(--ink-2); text-wrap: pretty; }
.metaline { margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; align-items: center; }
.metaline b { color: var(--ink-2); font-weight: 500; }
.hint { text-decoration: underline dotted var(--rule); text-underline-offset: 3px; cursor: help; }

/* stat strip: numbers with short labels; explanations live in the title tooltips */
.stats { display: flex; flex-wrap: wrap; gap: 14px 0; margin: 0; padding: 0; }
.stats > div { padding: 0 32px; border-left: 1px solid var(--rule-2); cursor: help; }
.stats > div:first-child { padding-left: 0; border-left: 0; }
.stats dt { font-size: 12.5px; color: var(--ink-3); }
.stats dd { margin: 0 0 3px; font: 400 25px/1.1 var(--sans); letter-spacing: -.012em; font-variant-numeric: tabular-nums; color: var(--ink); }
.stats dd small { font-size: 15px; color: var(--ink-3); letter-spacing: 0; }
.stats > div { display: flex; flex-direction: column-reverse; }

/* figure panels: space, letters, captions. No boxes. */
.fig { margin-top: 64px; }
.fig + .fig { margin-top: 64px; }
.fig-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px; }
.fig-h .pl { font: 700 19px/1 var(--sans); }
.fig-h .t { font: 600 16px/1.3 var(--sans); }
.fig-h .aside { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.caption { margin: 16px 0 0; max-width: 78ch; font: 400 15.5px/1.52 var(--serif); font-variation-settings: "opsz" 12; color: var(--ink-2); text-wrap: pretty; }
.caption b { font-weight: 650; color: var(--ink); }
.small { font-size: 13px; color: var(--ink-3); }

/* svg figure text */
svg text { font-family: var(--sans); fill: var(--ink-2); }
svg .tk { font-size: 11.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
svg .lbl { font-size: 12.5px; fill: var(--ink-2); }
svg .lbl-s { font-size: 11.5px; fill: var(--ink-3); }
svg .lbl-b { font-size: 12.5px; fill: var(--ink); font-weight: 600; }
svg .axis { stroke: var(--ink-3); stroke-width: 1; }
svg .grid { stroke: var(--rule-2); stroke-width: 1; }
svg .hair { stroke: var(--rule); stroke-width: 1; }
svg .band { fill: var(--best-wash); }
svg .band-edge { stroke: var(--best-edge); stroke-width: 1; }
svg .bestline { stroke: var(--best); stroke-width: 1.25; }
svg .whisk { stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; fill: none; }
svg .whisk.best { stroke: var(--best); }
svg .mean { fill: var(--ink); stroke: var(--paper); stroke-width: 2; }
svg .mean.best { fill: var(--best); }
svg .seed { fill: var(--ink-2); stroke: var(--paper); stroke-width: 2; }
svg .dia { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
svg .dia.best { stroke: var(--best); fill: var(--best-wash); }
svg .lead { stroke: var(--ink-3); stroke-width: 1; fill: none; }
svg .gap { stroke: var(--ink); stroke-width: 1.25; fill: none; }
svg .m-agent { fill: var(--agent); }
svg .m-human { fill: var(--human); }
svg .m-best { fill: var(--best); }
svg .m-ring { fill: var(--paper); stroke-width: 1.6; }
svg .m-ring.agent { stroke: var(--agent); }
svg .m-ring.human { stroke: var(--human); }
svg .m-fail { stroke: var(--fail); stroke-width: 2; stroke-linecap: round; }
svg .ringed { stroke: var(--paper); stroke-width: 2; }
svg .hit { fill: transparent; cursor: default; }

/* who glyph */
.who { display: inline-flex; align-items: center; gap: 6px; }
.who i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.who.agent i { background: var(--agent); }
.who.human i { background: var(--human); border-radius: 1px; }

/* buttons */
.btn {
  height: 32px; padding: 0 13px; border-radius: 6px; border: 1px solid var(--rule); background: transparent;
  font-size: 13.5px; color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; }
.btn:disabled { color: var(--ink-3); cursor: not-allowed; border-color: var(--rule-2); }
.btn.link { border: 0; padding: 0; height: auto; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.btn.link:hover { color: var(--ink); text-decoration-color: currentColor; }

.cmd {
  display: block; padding: 12px 14px; background: var(--paper-2); border-radius: 6px;
  font: 400 13px/1.6 var(--mono); color: var(--ink); white-space: pre-wrap; word-break: break-word;
}
/* ------------------------------------------------------------------ leaderboard */
.filters { display: flex; align-items: center; gap: 22px; margin-top: 36px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-2); }
.filters label { display: inline-flex; align-items: center; gap: 8px; }
.filters select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 6px; height: 30px; padding: 0 8px; }
.filters input { accent-color: var(--ink); }
.filters .r { margin-left: auto; display: flex; gap: 8px; }

.verdict .stats { margin-bottom: 26px; }
.forest { position: relative; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 118px 600px 64px 128px; gap: 0 24px; align-items: start; border-bottom: 1px solid var(--rule-2); min-height: 84px; padding: 16px 0 14px; }
.frow.head { min-height: 0; padding: 0 0 10px; border-bottom: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-3); align-items: end; }
.frow.axisrow { border-bottom: 0; min-height: 44px; }
.frow .nm { font-weight: 600; font-size: 16px; }
.frow .meta { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; display: flex; flex-direction: column; gap: 2px; }
.frow .acc { text-align: right; }
.frow .big { font: 400 24px/1.05 var(--sans); letter-spacing: -.01em; }
.frow .sd { font-size: 13px; color: var(--ink-3); margin-top: 5px; font-variant-numeric: tabular-nums; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
.frow .sd svg { overflow: visible; }
.frow .f1 { text-align: right; font-size: 14.5px; font-variant-numeric: tabular-nums; padding-top: 4px; }
.frow .vd { font-size: 14px; padding-top: 4px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; cursor: help; }
.frow .vd small { color: var(--ink-3); font-size: 12.5px; }
.lbhead .fig-h .aside { margin-left: auto; }
.vg { width: 10px; height: 10px; display: inline-block; flex: none; }
.vg.best { background: var(--best); transform: rotate(45deg) scale(.8); }
.vg.band { background: var(--best-wash); outline: 1px solid var(--best-edge); }
.vg.behind { border: 1.5px solid var(--ink-3); border-radius: 50%; }
.forest > svg { position: absolute; top: 0; pointer-events: none; overflow: visible; }

/* ------------------------------------------------------------------ run */
.run-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: start; }
.actions { display: flex; gap: 8px; padding-top: 10px; }
.hyp-q { margin: 20px 0 0; max-width: 70ch; font: italic 400 19px/1.5 var(--serif); color: var(--ink-2); }
h1.hyp { font-size: 27px; line-height: 1.25; font-weight: 450; max-width: 40em; text-wrap: pretty; letter-spacing: -.01em; }
.runscore { text-align: right; font: 300 44px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 18px; }
.runscore small { display: block; font: 400 12.5px/1.4 var(--sans); color: var(--ink-3); letter-spacing: 0; margin-top: 6px; }
.notes.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.status { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 18px; font-size: 14px; color: var(--ink-2); align-items: center; }
.tag { font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 99px; padding: 1px 9px; }
.run-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 72px; margin-top: 64px; }
.run-grid .fig { margin-top: 0; }
.run-grid .col > .fig + .fig { margin-top: 56px; }

.tree { font-size: 14px; }
.tree .root { display: grid; grid-template-columns: 116px minmax(0, 1fr) auto; gap: 0 16px; align-items: baseline; padding: 14px 0 10px; border-top: 1px solid var(--rule); }
.tree .root:first-child { border-top: 0; padding-top: 0; }
.tree .k { color: var(--ink); font-weight: 550; }
.tree .k small { display: block; color: var(--ink-3); font-weight: 400; font-size: 12.5px; }
.p { font-family: var(--mono); font-size: 13px; word-break: break-all; color: var(--ink); }
.p .pre { color: var(--ink-3); }
.host { font-family: var(--sans); font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; margin-right: 8px; vertical-align: 1px; }
.tree .kids { list-style: none; margin: 0 0 6px 132px; padding: 0; }
.tree .kids li { display: grid; grid-template-columns: 18px minmax(0, 1fr) 150px auto; gap: 0 10px; align-items: baseline; padding: 5px 0; }
.tree .kids li .br { color: var(--ink-3); font-family: var(--mono); font-size: 13px; }
.tree .kids li .what { font-size: 12.5px; color: var(--ink-3); text-align: right; }
.copy { border: 0; background: transparent; color: var(--ink-3); font-size: 12.5px; cursor: pointer; padding: 4px; border-radius: 4px; align-self: center; }
.copy:hover { color: var(--ink); background: var(--paper-2); }
.gitline { margin: 4px 0 8px 132px; font: 400 13px/1.5 var(--sans); color: var(--ink-3); }
.gitline b { color: var(--ink); font-weight: 650; }
.cmdrow { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 0 16px; align-items: start; padding: 0 0 18px; }
.cmdrow .tmpl { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }

.scores { width: 100%; border-collapse: collapse; }
.scores td { padding: 12px 0; border-top: 1px solid var(--rule-2); vertical-align: top; font-size: 14px; }
.scores tr:first-child td { border-top: 0; }
.scores .v { font: 400 30px/1 var(--sans); letter-spacing: -.015em; text-align: right; }
.scores small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 4px; }
.scores .v small { font-size: 12.5px; letter-spacing: 0; white-space: nowrap; }
.notes { font: 400 15.5px/1.55 var(--serif); color: var(--ink-2); margin: 0 0 12px; }
.notes .by { font: 400 12.5px/1.4 var(--sans); color: var(--ink-3); margin-bottom: 6px; display: flex; gap: 10px; }

/* ------------------------------------------------------------------ palette, toast, tooltip */
.pal { position: fixed; inset: 0; z-index: 50; display: none; background: color-mix(in srgb, var(--ink) 22%, transparent); }
.pal.on { display: block; }
.pal-box {
  width: 600px; margin: 110px auto 0; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 24px 60px -20px rgba(10, 14, 20, .35); overflow: hidden;
}
.pal-in { width: 100%; border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); font: 400 20px/1 var(--serif); padding: 20px 20px; outline: none; }
.pal-list { list-style: none; margin: 0; padding: 8px; max-height: 420px; overflow: auto; }
.pal-list .grp { font-size: 12px; color: var(--ink-3); padding: 10px 12px 4px; }
.pal-list li.it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 14.5px; align-items: baseline; }
.pal-list li.it small { color: var(--ink-3); font-size: 12.5px; }
.pal-list li.it[aria-selected="true"] { background: var(--paper-2); }
.pal-foot { border-top: 1px solid var(--rule); padding: 10px 20px; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 18px; }
.pal-foot kbd { font-family: var(--sans); font-size: 11.5px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 7px; font-size: 13.5px; transition: all .18s ease; pointer-events: none; z-index: 60; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 6px; max-width: 300px; opacity: 0; transition: opacity .08s; }
.tip.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ------------------------------------------------------------------ kind: training */
.key { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 7px; }
.key svg { display: block; overflow: visible; }
.sample { font-size: 12px; color: var(--human); border-color: color-mix(in srgb, var(--human) 45%, transparent); cursor: help; }
.kind { font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 99px; padding: 0 9px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { height: 30px; padding: 0 11px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.frow { grid-template-columns: minmax(0, 1fr) 118px 600px 84px 150px; }
.frow .nm .best-n { color: var(--best); }
.frow .f1 small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }

svg .sl { stroke: var(--ink-3); stroke-width: 1; fill: none; opacity: .6; }
svg .ml { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linejoin: round; }
svg .ml.best { stroke: var(--best); }
svg .raw { stroke: var(--ink-3); stroke-width: 1; fill: none; opacity: .45; }
svg .vl { stroke: var(--ink-2); stroke-width: 1.5; fill: none; }
svg .vdot { fill: var(--ink-2); }
svg .lrl { stroke: var(--ink-2); stroke-width: 1.5; fill: none; }
svg .lra { fill: var(--paper-2); }
svg .ev { stroke: var(--fail); stroke-width: 1.25; stroke-dasharray: 3 3; }
svg .evg { stroke: var(--fail); stroke-width: 1.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
svg .clipm { fill: var(--fail); }
svg .ck { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1.4; }
svg .xh { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; }
svg .seed.div { fill: var(--fail); }
svg .seed.kill { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1.5; }
svg .ttl { font-size: 14px; font-weight: 600; fill: var(--ink); }
svg .ttl.best { fill: var(--best); }
svg .spk { stroke: var(--ink-2); stroke-width: 1; fill: none; }
svg .spa { fill: var(--rule-2); }

.runs { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.runs th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12.5px; padding: 0 14px 8px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.runs td { padding: 8px 14px 8px 0; border-bottom: 1px solid var(--rule-2); vertical-align: middle; white-space: nowrap; }
.runs th:first-child, .runs td:first-child { padding-left: 8px; }
.runs .r { text-align: right; }
.runs tbody tr { cursor: pointer; }
.runs tbody tr:hover td { background: color-mix(in srgb, var(--paper-2) 60%, transparent); }
.runs tbody tr.sel td { background: var(--paper-2); }
.runs tbody tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--ink); }
.runs .dim { color: var(--ink-3); }
.runs .sp { display: inline-flex; align-items: center; gap: 8px; }
.runs .sp svg { display: block; }
.runs .sp span { width: 44px; text-align: right; color: var(--ink-2); font-size: 13px; }
.runs a { text-decoration-color: var(--rule); }
.st { display: inline-flex; align-items: center; gap: 8px; }
.st svg { display: block; overflow: visible; flex: none; }

.selbar { display: flex; align-items: center; gap: 18px; margin-top: 56px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); }

        <line x1="1" y1="9" x2="21" y2="9" style="stroke:var(--ink);stroke-width:1.4"/>

<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Find and run commands">

  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script src="data.js"></script>
<script>
/* ================================================================== data */
const HX = window.HX, RUNS = HX.runs, DS = HX.dataset, N_TEST = DS.n_test, STEPS = HX.schedule.steps;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f4 = v => v.toFixed(4), f3 = v => v.toFixed(3);
const MINUS = "−", NBH = "‑";
const short = id => id.slice(-4);
const kStep = s => (s === 0 ? "0" : (s / 1000) + "k");
const cStep = s => s.toLocaleString("en-US");
const hm = iso => iso.slice(11, 16);
const eLr = v => v.toExponential(0).replace("-", MINUS).replace("e", "e");
const nb = s => s.replace(/-/g, NBH);
const dur = (a, b) => { const m = Math.round((Date.parse(b) - Date.parse(a)) / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
const CFG = Object.fromEntries(HX.configs.map(c => [c.id, c]));
const CFG_ORDER = HX.configs.map(c => c.id);
const runsOf = id => RUNS.filter(r => r.config === id);
const runByShort = Object.fromEntries(RUNS.map(r => [short(r.run_id), r]));
const cname = id => nb(CFG[id].name);
const cdesc = c => `lr ${eLr(c.lr)}${c.aug ? ", SMILES aug" : ""}`;
const whoKind = c => (c.startsWith("agent:") ? "agent" : "human");
const whoHtml = c => `<span class="who ${whoKind(c)}"><i></i>${esc(c)}</span>`;
const hostPath = (host, p) => `${host}:${p}`;

/* ---- stats ---- */
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const sdev = a => (a.length < 2 ? 0 : Math.sqrt(a.reduce((x, y) => x + (y - mean(a)) ** 2, 0) / (a.length - 1)));
function wilson(p, n, z = 1.96) {
  const z2 = z * z, d = 1 + z2 / n, c = (p + z2 / (2 * n)) / d;
  const h = (z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n))) / d;
  return [c - h, c + h];
}
function lgamma(x) {
  const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let s = 1.000000000190015;
  for (let j = 0; j < 6; j++) s += g[j] / ++y;
  return -t + Math.log(2.5066282746310005 * s / x);
}
function betacf(a, b, x) {
  let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < 1e-30) d = 1e-30; d = 1 / d; let h = d;
  for (let m = 1; m <= 200; m++) {
    const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1 / d;
    const del = d * c; h *= del; if (Math.abs(del - 1) < 3e-12) break;
  }
  return h;
}
function ibeta(x, a, b) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
/* Welch two-sample t-test over seed scores, two-sided */
function welch(a, b) {
  const va = sdev(a) ** 2 / a.length, vb = sdev(b) ** 2 / b.length;
  const t = (mean(a) - mean(b)) / Math.sqrt(va + vb);
  const df = (va + vb) ** 2 / (va * va / (a.length - 1) + vb * vb / (b.length - 1));
  return { t, df, p: ibeta(df / (df + t * t), df / 2, 0.5) };
}
const fmtP = p => (p < 0.001 ? "< 0.001" : "= " + p.toFixed(3));

/* ---- curve helpers ---- */
function ema(pts, a = 0.12) { let m = null; return pts.map(([s, v]) => [s, (m = m == null ? v : m + a * (v - m))]); }
RUNS.forEach(r => { r.trainEma = ema(r.train); r.evt = r.event ? r.event.kind : null; });
function meanSeries(list) {
  const by = new Map();
  list.forEach(pts => pts.forEach(([s, v]) => { if (!by.has(s)) by.set(s, []); by.get(s).push(v); }));
  return [...by.entries()].sort((a, b) => a[0] - b[0]).map(([s, vs]) => [s, mean(vs)]);
}
const at = (pts, s) => { for (let i = pts.length - 1; i >= 0; i--) if (pts[i][0] <= s) return pts[i]; return null; };

/* ================================================================== leaderboard model */
let MODE = new URLSearchParams(location.search).get("mode") === "final" ? "final" : "best";
const scoreOf = (r, m = MODE) => (m === "best" ? r.best_top1 : r.final_top1);
function board(m = MODE) {
  const rows = CFG_ORDER.map(id => {
    const all = runsOf(id), used = all.filter(r => scoreOf(r, m) != null), vals = used.map(r => scoreOf(r, m));
    const o = m === "best" ? "final" : "best", ov = all.map(r => scoreOf(r, o)).filter(v => v != null);
    return { id, cfg: CFG[id], all, used, vals, mean: mean(vals), sd: sdev(vals), n: vals.length, ci: wilson(mean(vals), N_TEST), other: mean(ov), otherN: ov.length };
  }).sort((a, b) => b.mean - a.mean);
  const best = rows[0];
  rows.forEach(r => {
    r.isBest = r === best;
    r.gap = best.mean - r.mean;
    r.test = r.isBest ? null : welch(best.vals, r.vals);
    r.k = r.isBest ? "best" : r.mean >= best.ci[0] ? "band" : "behind";
  });
  return { rows, best, runner: rows[1] };
}
const bestRun = () => RUNS.reduce((a, b) => ((b.best_top1 || 0) > (a.best_top1 || 0) ? b : a));
let SEL = bestRun();

/* ================================================================== svg primitives (ui-v4) */
const S = {
  line: (x1, y1, x2, y2, c) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`,
  rect: (x, y, w, h, c, extra = "") => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${h}" class="${c}" ${extra}/>`,
  circ: (x, y, r, c, extra = "") => `<circle cx="${x}" cy="${y}" r="${r}" class="${c}" ${extra}/>`,
  text: (x, y, t, c, a = "start", extra = "") => `<text x="${x}" y="${y}" class="${c}" text-anchor="${a}" ${extra}>${t}</text>`,
  dia: (x, y, r, c) => `<path d="M${x} ${y - r}L${x + r} ${y}L${x} ${y + r}L${x - r} ${y}Z" class="${c}"/>`,
  sq: (x, y, r, c) => `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" rx="1.5" class="${c}"/>`,
  cross: (x, y, r) => `<path d="M${x - r} ${y - r}L${x + r} ${y + r}M${x + r} ${y - r}L${x - r} ${y + r}" class="m-fail"/>`,
  spike: (x, y, s = 1) => `<path d="M${x - 6 * s} ${y + 4 * s}H${x - 2.5 * s}L${x} ${y - 5 * s}L${x + 2.5 * s} ${y + 4 * s}H${x + 6 * s}" class="evg"/>`,
  svg: (w, h, body, extra = "") => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" ${extra}>${body}</svg>`,
};
const path = (pts, X, Y, c) => pts.length ? `<path d="${pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("")}" class="${c}"/>` : "";
function seedDots(X, items, y) {
  const xs = items.map(it => ({ ...it, x: X(it.v) })).sort((a, b) => a.x - b.x);
  let h = "", prev = -1e9, lvl = 0;
  xs.forEach(it => { lvl = it.x - prev < 8 ? lvl + 1 : 0; h += S.circ(it.x, y - lvl * 8, 3.8, "seed" + (it.c ? " " + it.c : "")); prev = it.x; });
  return h;
}
function whisker(X, y, lo, hi, best) {
  return `<path d="M${X(lo)} ${y}H${X(hi)}M${X(lo)} ${y - 4}V${y + 4}M${X(hi)} ${y - 4}V${y + 4}" class="whisk${best ? " best" : ""}"/>`;
}
const G = {
  band: `<svg width="18" height="12"><rect x="3" y="0" width="12" height="12" class="band"/><line x1="3" y1="0" x2="3" y2="12" class="band-edge"/><line x1="15" y1="0" x2="15" y2="12" class="band-edge"/></svg>`,
  seed: `<svg width="18" height="12">${S.circ(5, 6, 3.6, "seed")}${S.circ(13, 6, 3.6, "seed")}</svg>`,
  sdiv: `<svg width="10" height="12">${S.circ(5, 6, 3.6, "seed div")}</svg>`,
  skill: `<svg width="10" height="12">${S.circ(5, 6, 3.6, "seed kill")}</svg>`,
  whisk: `<svg width="22" height="12"><path d="M2 6H20M2 2V10M20 2V10" class="whisk"/></svg>`,
  sl: `<svg width="22" height="12"><path d="M1 8L8 5L14 7L21 3" class="sl" style="opacity:1"/></svg>`,
  ml: `<svg width="22" height="12"><path d="M1 8L8 5L14 7L21 3" class="ml"/></svg>`,
  ck: `<svg width="12" height="12">${S.circ(6, 6, 4, "m-best ringed")}</svg>`,
  ckh: `<svg width="12" height="12">${S.circ(6, 6, 3.2, "ck")}</svg>`,
  spike: `<svg width="16" height="12">${S.spike(8, 6, .9)}</svg>`,
  kill: `<svg width="12" height="12">${S.cross(6, 6, 4)}</svg>`,
  raw: `<svg width="22" height="12"><path d="M1 7L4 4L6 9L9 3L12 8L15 5L18 8L21 4" class="raw" style="opacity:.9"/></svg>`,
  val: `<svg width="22" height="12"><path d="M2 6H20" class="vl"/>${S.circ(5, 6, 2.4, "vdot")}${S.circ(17, 6, 2.4, "vdot")}</svg>`,
};
const statusGlyph = r => {
  const b = r === bestRun();
  const body = r.evt === "killed" ? S.cross(6, 7, 4) : r.evt === "diverged" ? S.spike(6, 7, .8) : S.circ(6, 7, 4, b ? "m-best" : "seed");
  return `<svg width="12" height="14" aria-hidden="true">${body}</svg>`;
};
const statusText = r => (r.evt === "killed" ? `killed ${kStep(r.event.step)}` : r.evt === "diverged" ? `spike ${kStep(r.event.step)}` : "done");
const statusTip = r => (r.evt === "killed" ? `Killed at step ${cStep(r.event.step)}: ${r.event.why}, exit ${r.exit_code}. Last checkpoint ${cStep(r.ckpts.at(-1).step)}.` : r.evt === "diverged" ? `Loss spike at step ${cStep(r.event.step)} (train loss ${r.event.peak.toFixed(2)}). Recovered, but ends lower. Best checkpoint ${cStep(r.best_step)} is before the spike.` : `Finished, exit 0, ${dur(r.started_at, r.ended_at)}`);

/* ================================================================== stacked panels, shared x = step */
const STACKS = {};
function yScale(y, top, h) {
  if (y.kind === "log") { const a = Math.log(y.lo), b = Math.log(y.hi); return v => top + h - ((Math.log(Math.max(v, 1e-9)) - a) / (b - a)) * h; }
  return v => top + h - ((v - y.lo) / (y.hi - y.lo)) * h;
}
function drawStack(el, spec) {
  const W = el.clientWidth, LW = spec.LW, GAP = spec.gap || 28, nc = spec.cols.length;
  const colW = (W - LW - GAP * (nc - 1)) / nc;
  const TH = spec.titles ? 34 : 6, RG = spec.rowGap || 16;
  let y = TH;
  const rows = spec.rows.map(r => { const o = Object.assign({}, r, { top: y }); y += r.h + RG; return o; });
  const bottom = y - RG, H = bottom + 30;
  let h = "";
  spec.cols.forEach((col, ci) => {
    const x0 = LW + ci * (colW + GAP), X = s => x0 + (s / STEPS) * colW;
    col._x0 = x0; col._X = X;
    if (spec.titles) h += `<g data-tip="${esc(col.tip || "")}" style="cursor:help">${S.text(x0, 15, col.title, "ttl" + (col.best ? " best" : ""))}${S.text(x0 + col.title.length * 8.4 + 10, 15, col.sub || "", "lbl-s")}</g>`;
    rows.forEach((r, ri) => {
      const Y = yScale(r.y, r.top, r.h);
      (r.y.ticks || []).forEach(t => {
        h += S.line(x0, Y(t), x0 + colW, Y(t), "grid");
        if (ci === 0) h += S.text(LW - 10, Y(t) + 4, r.y.fmt(t), "tk", "end");
      });
      h += S.line(x0, r.top + r.h, x0 + colW, r.top + r.h, ri === rows.length - 1 ? "axis" : "hair");
      const cid = `${el.id}-c${ci}r${ri}`;
      h += `<clipPath id="${cid}"><rect x="${x0 - 2}" y="${r.top - 3}" width="${colW + 4}" height="${r.h + 6}"/></clipPath>`;
      const out = r.draw(col, X, Y, r);
      h += `<g clip-path="url(#${cid})">${out.clip || ""}</g>${out.free || ""}`;
    });
    [0, 5000, 10000, 15000, 20000].forEach(s => { h += S.line(X(s), bottom, X(s), bottom + 4, "axis") + S.text(X(s), bottom + 17, kStep(s), "tk", s === 20000 && ci === nc - 1 ? "end" : "middle"); });
  });
  rows.forEach(r => (h += `<g ${r.tip ? `data-tip="${esc(r.tip)}" style="cursor:help"` : ""}>${S.text(0, r.top + r.h / 2 + 4, r.label, "lbl")}</g>`));
  h += `<line class="xh" x1="0" x2="0" y1="${TH - 4}" y2="${bottom}" style="display:none"/>`;
  spec.cols.forEach((col, ci) => (h += `<rect class="hit" data-stack="${el.id}" data-col="${ci}" x="${col._x0}" y="${TH - 4}" width="${colW}" height="${bottom - TH + 4}" style="cursor:crosshair"/>`));
  el.innerHTML = S.svg(W, H, h, `role="img" aria-label="${esc(spec.aria)}" style="overflow:visible;pointer-events:auto"`);
  STACKS[el.id] = { spec, colW, snap: spec.snap || 500 };
}
function stackHover(e, rect) {
  const st = STACKS[rect.dataset.stack], col = st.spec.cols[+rect.dataset.col];
  const svg = rect.ownerSVGElement, px = e.clientX - svg.getBoundingClientRect().left;
  const s = Math.max(st.snap, Math.min(STEPS, Math.round((((px - col._x0) / st.colW) * STEPS) / st.snap) * st.snap));
  const xh = svg.querySelector(".xh"); xh.setAttribute("x1", col._X(s)); xh.setAttribute("x2", col._X(s)); xh.style.display = "";
  return st.spec.tip(col, s);
}

/* shared y-scales, same on every screen */
const Y_TRAIN = { kind: "log", lo: 0.06, hi: 0.8, ticks: [0.1, 0.2, 0.4], fmt: t => t.toFixed(1) };
const Y_VLOSS = { kind: "log", lo: 0.105, hi: 0.5, ticks: [0.12, 0.2, 0.4], fmt: t => (t < 0.15 ? t.toFixed(2) : t.toFixed(1)) };
const Y_TOP1 = { kind: "lin", lo: 0.84, hi: 0.918, ticks: [0.85, 0.87, 0.89, 0.91], fmt: t => t.toFixed(2) };
const Y_LR = { kind: "lin", lo: 0, hi: 3.4e-4, ticks: [], fmt: t => t };

/* clip indicator: a value outside the panel, shown as a red caret at the edge with its number */
function clipMark(x, yEdge, up, v, fmt) {
  const d = up ? `M${x - 4} ${yEdge + 5}L${x} ${yEdge - 1}L${x + 4} ${yEdge + 5}Z` : `M${x - 4} ${yEdge - 5}L${x} ${yEdge + 1}L${x + 4} ${yEdge - 5}Z`;
  return `<path d="${d}" class="clipm"/>` + (up ? S.text(x + 8, yEdge + 6, fmt(v), "lbl-s") : S.text(x - 8, yEdge - 1, fmt(v), "lbl-s", "end"));
}
function eventMarks(runs, X, Y, r, series, isFirstRow) {
  let free = "";
  runs.forEach(run => {
    if (run.evt === "diverged") {
      const x = X(run.event.step);
      free += S.line(x, r.top, x, r.top + r.h, "ev");
      if (r.clipUp) { const v = run.event.peak; free += clipMark(x, r.top, true, v, t => t.toFixed(1)); }
      if (r.clipDown) { const v = Math.min(...run.val.filter(p => p[0] >= run.event.step).map(p => p[1])); free += clipMark(x, r.top + r.h, false, v, t => t.toFixed(2)); }
      if (isFirstRow) free += S.spike(x - 16, r.top - 8, .8) + S.text(x - 26, r.top - 4, kStep(run.event.step), "lbl-s", "end");
    }
    if (run.evt === "killed") {
      const p = series(run).at(-1);
      if (p) free += S.cross(X(p[0]), Math.max(r.top, Math.min(r.top + r.h, Y(p[1]))), 3.5);
    }
  });
  return free;
}

    const vtip = g.isBest ? "Best mean. Its test-set 95% CI is the green band." : `${g.k === "band" ? "Mean inside" : "Mean below"} the best's 95% CI. Welch t-test over seeds, t = ${g.test.t.toFixed(2)}, df = ${g.test.df.toFixed(1)}, p ${fmtP(g.test.p)}.`;

        <div class="sd"><span title="Test-set noise: 95% CI (Wilson, n = ${N_TEST.toLocaleString("en-US")})">${f3(g.ci[0])}–${f3(g.ci[1])}</span></div></div>
      <div class="fplot"></div>

        <div title="Runs that stopped early or spiked"><dt>spike / killed</dt><dd>${nDiv} <small>/</small> ${nKill}</dd></div>

  drawTaskCharts();

  $("#showSeeds").addEventListener("change", drawForest);
  document.querySelectorAll("#v-task .seg button").forEach(b => b.addEventListener("click", () => { MODE = b.dataset.mode; renderTask(); }));

  markSel();
}
function runRow(r, i) {
  const util = Math.round(mean(r.sys.filter(p => p[0] > 300).map(p => p[1]))), mem = Math.max(...r.sys.map(p => p[2]));
  return `<tr data-i="${i}" tabindex="0" aria-label="Select run ${short(r.run_id)}">
    <td><span class="st">${statusGlyph(r)}<a href="#run/${short(r.run_id)}" title="${esc(r.run_id)}">${short(r.run_id)}</a></span></td>
    <td>${cname(r.config)}</td><td class="r">${r.seed}</td>
    <td title="${esc(statusTip(r))}">${r.evt ? statusText(r) : ""}</td>
    <td class="r">${kStep(r.steps)}</td><td class="r">${kStep(r.best_step)}</td>
    <td class="r">${f4(r.best_top1)}</td><td class="r${r.final_top1 == null ? " dim" : ""}">${r.final_top1 == null ? "—" : f4(r.final_top1)}</td>
    <td><span class="sp" title="GPU utilisation, mean per 500 steps">${sparkSvg(r, 1, 0, 100)}<span>${util}%</span></span></td>
    <td><span class="sp" title="GPU memory, peak ${mem.toFixed(1)} of 80 GB">${sparkSvg(r, 2, 0, 80)}<span>${Math.round(mem)} GB</span></span></td>
    <td class="dim">${esc(r.host)}</td>
  </tr>`;
}
function sparkSvg(r, k, lo, hi) {
  const W = 120, H = 20, X = s => (s / STEPS) * W, Y = v => H - 1 - ((v - lo) / (hi - lo)) * (H - 2);
  const pts = [];
  for (let i = 0; i < r.sys.length; i += 5) { const w = r.sys.slice(i, i + 5); pts.push([w.at(-1)[0], mean(w.map(p => p[k]))]); }
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const end = r.evt === "killed" ? S.cross(X(r.steps), H / 2, 3) : "";
  return `<svg width="${W}" height="${H}" aria-hidden="true" style="overflow:visible">${S.line(0, H - 0.5, W, H - 0.5, "grid")}<path d="${d}L${X(pts.at(-1)[0])} ${H}L${X(pts[0][0])} ${H}Z" class="spa"/><path d="${d}" class="spk"/>${end}</svg>`;
}
function markSel() { document.querySelectorAll("#runsT tbody tr").forEach(tr => tr.classList.toggle("sel", RUNS[+tr.dataset.i] === SEL)); $("#runTab").textContent = "Run " + short(SEL.run_id); }

function drawForest() {
  const box = $("#forest"); if (!box || !box.offsetParent) return;
  box.querySelectorAll(":scope > svg").forEach(s => s.remove());
  const B = board(), best = B.best;
  const cells = [...box.querySelectorAll(".fplot")], first = cells[0];
  const left = first.offsetLeft, W = first.clientWidth, H = box.clientHeight;
  const all = B.rows.flatMap(g => [...g.vals, g.ci[0], g.ci[1]]);
  const step = Math.max(...all) - Math.min(...all) > 0.035 ? 0.01 : 0.005;
  const lo = Math.floor((Math.min(...all) - 0.002) / step) * step, hi = Math.ceil((Math.max(...all) + 0.002) / step) * step;
  const X = v => 8 + ((v - lo) / (hi - lo)) * (W - 16);
  const ticks = []; for (let t = lo; t <= hi + 1e-9; t += step) ticks.push(+t.toFixed(3));
  const showSeeds = $("#showSeeds") ? $("#showSeeds").checked : true;
  const head = box.querySelector(".frow.head"), axisRow = box.querySelector(".frow.axisrow");
  const yTop = head.offsetTop + head.offsetHeight, yAx = axisRow.offsetTop + 8;
  let h = "";
  ticks.forEach(t => (h += S.line(X(t), yTop, X(t), yAx, "grid")));
  const a = X(best.ci[0]), b = X(best.ci[1]);
  h += S.rect(a, yTop, b - a, yAx - yTop, "band") + S.line(a, yTop, a, yAx, "band-edge") + S.line(b, yTop, b, yAx, "band-edge");
  h += S.line(X(best.mean), yTop, X(best.mean), yAx, "bestline");
  B.rows.forEach((g, i) => {
    const r = box.querySelector(`.frow[data-row="${i}"]`);
    const yS = r.offsetTop + 30, yI = r.offsetTop + 58;
    const items = g.all.map(run => ({ run, v: scoreOf(run), c: run.evt === "diverged" ? "div" : run.evt === "killed" ? "kill" : "" })).filter(it => it.v != null);
    if (showSeeds) {
      h += seedDots(X, items, yS);
      const xs = items.map(it => X(it.v));
      const tipS = `${CFG[g.id].name}, ${MODE === "best" ? "best ckpt" : "final"}\n` + g.all.map(run => `seed ${run.seed}: ${scoreOf(run) == null ? "none, killed" : f4(scoreOf(run))}${MODE === "best" ? ` at ${kStep(run.best_step)}` : ""}${run.evt === "diverged" ? ", spiked" : run.evt === "killed" && MODE === "best" ? ", killed" : ""}`).join("\n");
      h += `<rect x="${Math.min(...xs) - 10}" y="${yS - 22}" width="${Math.max(...xs) - Math.min(...xs) + 20}" height="32" class="hit" data-tip="${esc(tipS)}"/>`;
    }
    h += whisker(X, yI, g.ci[0], g.ci[1], g.isBest);
    h += S.sq(X(g.mean), yI, 4.5, "mean" + (g.isBest ? " best" : ""));
    h += `<rect x="${X(g.ci[0])}" y="${yI - 10}" width="${X(g.ci[1]) - X(g.ci[0])}" height="20" class="hit" data-tip="${esc(`${CFG[g.id].name}\nmean ${f4(g.mean)}, seed σ ${f4(g.sd)}\ntest 95% CI ${f4(g.ci[0])}–${f4(g.ci[1])}\n(Wilson, n = ${N_TEST.toLocaleString("en-US")})`)}"/>`;
  });
  h += S.line(0, yAx, W, yAx, "axis");
  ticks.forEach((t, i) => { h += S.line(X(t), yAx, X(t), yAx + 4, "axis"); if (step === 0.01 || i % 2 === 0) h += S.text(X(t), yAx + 17, t.toFixed(step === 0.01 ? 2 : 3), "tk", "middle"); });
  h += S.text(W, yAx + 36, `top${NBH}1 v1, test`, "lbl-s", "end");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H + 20); svg.setAttribute("viewBox", `0 0 ${W} ${H + 20}`);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Test top-1 by config, with seed scores and test-set intervals");
  svg.style.left = left + "px"; svg.style.pointerEvents = "auto"; svg.innerHTML = h;
  box.appendChild(svg);
}

function drawCurves() {
  const B = board();
  const cols = CFG_ORDER.map(id => {
    const c = CFG[id], rs = runsOf(id);
    return { id, runs: rs, title: cname(id), sub: cdesc(c).replace(/^lr [^,]+$/, m => (m.slice(3) === eLr(c.lr) && c.name.startsWith("lr") ? "" : m)), best: id === B.best.id, tip: `${c.name}: ${cdesc(c)}, commit ${c.commit}, by ${c.created_by}\n${rs.length} seeds, cosine lr, ${HX.schedule.warmup} warmup` };
  });
  const lineRow = (series, meanOf) => (col, X, Y, r) => {
    let clip = "";
    col.runs.forEach(run => (clip += path(series(run), X, Y, "sl")));
    clip += path(meanOf ? meanOf(col) : meanSeries(col.runs.map(series)), X, Y, "ml" + (col.best ? " best" : ""));
    return { clip, free: eventMarks(col.runs, X, Y, r, series, r.key === "train") };
  };
  const trainS = run => run.trainEma, vlossS = run => run.val.map(p => [p[0], p[2]]), top1S = run => run.val.map(p => [p[0], p[1]]);
  drawStack($("#curves"), {
    LW: 104, gap: 36, titles: true, snap: 500, aria: "Train loss, val loss, val top-1 and learning rate by step, one column per config",
    cols,
    rows: [
      { key: "train", label: "train loss", h: 116, y: Y_TRAIN, clipUp: true, draw: lineRow(trainS), tip: "Per-step train loss, EMA 0.12, log scale" },
      { key: "vloss", label: "val loss", h: 116, y: Y_VLOSS, draw: lineRow(vlossS), tip: `Val loss every ${HX.schedule.val_every} steps, log scale` },
      { key: "top1", label: `val top${NBH}1`, h: 150, y: Y_TOP1, clipDown: true, tip: `Val top-1 every ${HX.schedule.val_every} steps, n = ${DS.n_val.toLocaleString("en-US")}`, draw: (col, X, Y, r) => {
        const o = lineRow(top1S)(col, X, Y, r);
        col.runs.forEach(run => { const ck = run.ckpts.find(c => c.best); o.free += S.circ(X(ck.step), Y(ck.val_top1), run === bestRun() ? 5 : 4, "m-best ringed"); });
        return o;
      } },
      { key: "lr", label: "lr", h: 40, y: Y_LR, tip: `Cosine, ${HX.schedule.warmup} warmup, floor 0.1`, draw: (col, X, Y, r) => {
        const run = col.runs.find(x => !x.evt) || col.runs[0], pts = run.lr;
        const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
        const pk = pts.reduce((a, b) => (b[1] > a[1] ? b : a));
        return { clip: `<path d="${d}L${X(pts.at(-1)[0])} ${Y(0)}L${X(0)} ${Y(0)}Z" class="lra"/><path d="${d}" class="lrl"/>`, free: S.text(X(STEPS), r.top + 10, "peak " + eLr(CFG[col.id].lr), "lbl-s", "end") };
      } },
    ],
    tip: (col, s) => {
      const rs = col.runs, v = (run, k) => { const p = at(run.val, s); return p && s <= run.steps ? p[k] : null; };
      const cell = (x, f) => `<td>${x == null ? "—" : f(x)}</td>`;
      const tr = (lbl, fn, f) => `<tr><td>${lbl}</td>${rs.map(run => cell(fn(run), f)).join("")}<td>${(() => { const xs = rs.map(fn).filter(x => x != null); return xs.length ? `<b>${f(mean(xs))}</b>` : "—"; })()}</td></tr>`;
      const notes = rs.filter(run => run.evt && s >= run.event.step - 250).map(run => `seed ${run.seed}: ${statusText(run)}`);
      const lr = at(rs[0].lr, s);
      return `<table class="tt"><tr><th colspan="5">${esc(CFG[col.id].name)}, step ${cStep(s)}</th></tr>
        <tr class="n"><td></td>${rs.map(run => `<td>s${run.seed}</td>`).join("")}<td>mean</td></tr>
        ${tr("train", run => (s <= run.steps ? at(run.trainEma, s)[1] : null), f3)}
        ${tr("val loss", run => v(run, 2), f3)}
        ${tr("val top-1", run => v(run, 1), f4)}
        </table><div style="margin-top:4px;opacity:.75">lr ${lr[1].toExponential(2)}${s % HX.schedule.ckpt_every === 0 ? ", checkpoint" : ""}</div>${notes.length ? `<div style="margin-top:2px">${notes.join("<br>")}</div>` : ""}`;
    },
  });
}

      <div class="root"><span class="k" title="Everything this run wrote">Run</span><span>${hpHtml(r.host, P.run_dir)}</span>${copyBtn(hostPath(r.host, P.run_dir))}</div>
      <ul class="kids">
        ${kid(P.stdout, "")}${kid(P.stderr, r.evt === "killed" ? `exit ${r.exit_code}` : "")}${kid(P.metrics, `${(r.train.length + r.val.length).toLocaleString("en-US")} rows`)}${kid(P.config, "")}${kid(P.ckpt_dir + "/", `${r.ckpts.length} files, ${(r.ckpts.length * r.ckpts[0].size_gb).toFixed(1)} GB`, "└")}
      </ul>
    </div>`;
}
function ckptHtml(r, compact) {
  const dir = r.paths.ckpt_dir;
  return `<div class="ckroot">${hpHtml(r.host, dir + "/")}${copyBtn(hostPath(r.host, dir))}</div>
    <table class="ckt"><thead><tr><th>step</th><th title="Val top-1, n = ${DS.n_val.toLocaleString("en-US")}">val top${NBH}1</th>${compact ? "" : `<th>val loss</th>`}<th title="Test top-1, n = ${N_TEST.toLocaleString("en-US")}; scored for the best-val and last checkpoints">test</th><th class="f">file</th><th></th></tr></thead>
    <tbody>${[...r.ckpts].reverse().map(c => `<tr class="${c.best ? "best" : ""}"${c.best ? ` title="Best-val checkpoint"` : ""}>
      <td><span class="m">${c.best ? `<svg width="10" height="10" aria-hidden="true">${S.circ(5, 5, 4, "m-best")}</svg>` : `<svg width="10" height="10" aria-hidden="true"></svg>`}${kStep(c.step)}</span></td>
      <td>${f4(c.val_top1)}</td>${compact ? "" : `<td>${f3(c.val_loss)}</td>`}<td>${c.test_top1 != null ? f4(c.test_top1) : `<span style="color:var(--ink-3)">·</span>`}</td>
      <td class="f">${c.path.slice(dir.length + 1)}</td><td class="c">${copyBtn(hostPath(r.host, c.path))}</td></tr>`).join("")}</tbody></table>`;
}
function renderSel() {
  const r = SEL;
  $("#selbox").innerHTML = `
    <div class="selbar"><span class="st">${statusGlyph(r)}<b>${short(r.run_id)}</b></span><span>${cname(r.config)}, seed ${r.seed}</span><span title="${esc(statusTip(r))}">${statusText(r)}</span><span>${esc(r.host)} ${r.gpu}</span><a href="#run/${short(r.run_id)}">Open run</a>${actionsHtml(r)}</div>
    <div class="two-x">
      <div class="fig"><div class="fig-h"><span class="pl">d</span><span class="t">Paths</span><span class="aside">${short(r.run_id)}</span></div>${pathsHtml(r)}</div>
      <div class="fig"><div class="fig-h"><span class="pl">e</span><span class="t">Checkpoints</span><span class="aside">every ${kStep(HX.schedule.ckpt_every)}</span></div>${ckptHtml(r, false)}</div>
    </div>`;
}

/* ================================================================== RUN screen */
function renderRun() {
  const r = SEL, c = CFG[r.config], best = r.ckpts.find(k => k.best), iv = wilson(best.test_top1, N_TEST);
  const util = Math.round(mean(r.sys.filter(p => p[0] > 300).map(p => p[1]))), mem = Math.max(...r.sys.map(p => p[2]));
  const minVl = r.val.reduce((a, b) => (b[2] < a[2] ? b : a));
  const suffix = r.evt === "diverged" ? `, spiked at ${kStep(r.event.step)}` : r.evt === "killed" ? `, killed at ${kStep(r.event.step)}` : "";
  $("#v-run").innerHTML = `
    <p class="crumb"><a href="#task">${esc(HX.project)}</a><span class="sep">/</span><a href="#task">${esc(HX.task)}</a><span class="sep">/</span>${cname(r.config)}<span class="sep">/</span>${esc(r.run_id)}</p>
    <div class="run-top">
      <div>
        <h1 class="finding" id="run-h">${cname(r.config)}, seed ${r.seed}: ${f4(best.test_top1)} top${NBH}1 at ${kStep(best.step)}${suffix}</h1>
        <div class="metaline">
          <span class="st" title="${esc(statusTip(r))}">${statusGlyph(r)}<b>${statusText(r)}</b>&nbsp;${dur(r.started_at, r.ended_at)}</span>
          <span>${esc(r.host)} ${r.gpu}, ${esc(r.gpu_name)}</span>
          <span title="${esc(r.started_at)}">${hm(r.started_at)} UTC, 24 Sep</span>
          ${whoHtml(r.created_by)}
          <span class="p">${esc(r.git.branch)} @ ${esc(r.git.commit)}</span>
          <span class="kind">training</span>
        </div>
      </div>
      ${actionsHtml(r)}
    </div>
    <div class="run-stats">
      <dl class="stats">
        <div title="Test top-1 of the best-val checkpoint (step ${cStep(best.step)}), n = ${N_TEST.toLocaleString("en-US")}"><dt>test top${NBH}1</dt><dd>${f4(best.test_top1)}</dd></div>
        <div title="Test-set noise: 95% CI (Wilson, n = ${N_TEST.toLocaleString("en-US")})"><dt>95% CI</dt><dd>${f3(iv[0])}–${f3(iv[1])}</dd></div>
        <div title="Test top-1 at the last step"><dt>final</dt><dd>${r.final_top1 == null ? "—" : f4(r.final_top1)}</dd></div>
        <div title="Best val top-1 over checkpoints, n = ${DS.n_val.toLocaleString("en-US")}"><dt>val top${NBH}1</dt><dd>${f4(best.val_top1)}</dd></div>
        <div title="Lowest val loss, at step ${cStep(minVl[0])}"><dt>val loss</dt><dd>${f3(minVl[2])}</dd></div>
        <div title="Steps run of ${cStep(STEPS)}"><dt>steps</dt><dd>${kStep(r.steps)}${r.steps < STEPS ? ` <small>/ ${kStep(STEPS)}</small>` : ""}</dd></div>
        <div title="Mean GPU utilisation; peak memory ${mem.toFixed(1)} GB of 80"><dt>GPU</dt><dd>${util}<small>%</small></dd></div>
      </dl>
    </div>
    <div class="run-grid">
      <div class="col">
        <div class="fig"><div class="fig-h"><span class="pl">a</span><span class="t">Curves</span><span class="aside">${short(r.run_id)}, seed ${r.seed}</span></div>
          <div id="runCurves"></div>
          <div class="key" aria-label="Key"><span>${G.raw}train</span><span>${G.ml}train EMA</span><span>${G.val}val</span><span>${G.sl}other seeds</span><span>${G.ckh}ckpt</span><span>${G.ck}best ckpt</span>${r.evt === "diverged" ? `<span>${G.spike}spike</span>` : ""}${r.evt === "killed" ? `<span>${G.kill}killed</span>` : ""}</div>
        </div>
      </div>
      <div class="col">
        <div class="fig"><div class="fig-h"><span class="pl">b</span><span class="t">Checkpoints</span><span class="aside">${r.ckpts.length}, ${(r.ckpts.length * r.ckpts[0].size_gb).toFixed(1)} GB</span></div>${ckptHtml(r, true)}</div>
      </div>
    </div>
    <div class="fig" style="max-width:860px"><div class="fig-h"><span class="pl">c</span><span class="t">Paths</span><span class="aside"><span class="host" style="margin:0" title="Run host">${esc(r.host)}</span></span></div>${pathsHtml(r)}</div>`;
  $("#runTab").textContent = "Run " + short(r.run_id);
  drawRunCharts();
}
function drawRunCharts() {
  const r = SEL, sibs = runsOf(r.config).filter(x => x !== r);
  const col = { id: r.config, runs: [r] };
  const rowsBest = r.config === board().best.id;
  drawStack($("#runCurves"), {
    LW: 120, titles: false, snap: 100, aria: `Curves for run ${short(r.run_id)}`,
    cols: [col],
    rows: [
      { key: "train", label: "loss", h: 170, y: Y_TRAIN, clipUp: true, tip: "Train loss per 50 steps, its EMA, and val loss; log scale", draw: (c, X, Y, row) => {
        let clip = path(r.train, X, Y, "raw") + path(r.trainEma, X, Y, "ml") + path(r.val.map(p => [p[0], p[2]]), X, Y, "vl");
        r.val.forEach(p => (clip += S.circ(X(p[0]), Y(p[2]), 1.9, "vdot")));
        return { clip, free: eventMarks([r], X, Y, row, run => run.trainEma, true) };
      } },
      { key: "top1", label: `val top${NBH}1`, h: 170, y: Y_TOP1, clipDown: true, tip: `Val top-1 every ${HX.schedule.val_every} steps; dots are checkpoints`, draw: (c, X, Y, row) => {
        let clip = sibs.map(s => path(s.val.map(p => [p[0], p[1]]), X, Y, "sl")).join("") + path(r.val.map(p => [p[0], p[1]]), X, Y, "ml" + (rowsBest && r === bestRun() ? " best" : ""));
        let free = "";
        r.ckpts.forEach(k => { if (!k.best && k.val_top1 >= Y_TOP1.lo) free += S.circ(X(k.step), Y(k.val_top1), 3.2, "ck"); });
        const bk = r.ckpts.find(k => k.best); free += S.circ(X(bk.step), Y(bk.val_top1), 5, "m-best ringed");
        free += S.text(X(bk.step), Y(bk.val_top1) - 11, f4(bk.val_top1), "lbl-b", "middle");
        return { clip, free: free + eventMarks([r], X, Y, row, run => run.val.map(p => [p[0], p[1]]), false) };
      } },
      { key: "lr", label: "lr", h: 40, y: Y_LR, tip: `Cosine, ${HX.schedule.warmup} warmup, floor 0.1`, draw: (c, X, Y, row) => {
        const pts = r.lr, d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
        const pk = pts.reduce((a, b) => (b[1] > a[1] ? b : a));
        return { clip: `<path d="${d}L${X(pts.at(-1)[0])} ${Y(0)}L${X(0)} ${Y(0)}Z" class="lra"/><path d="${d}" class="lrl"/>`, free: S.text(X(STEPS), row.top + 10, "peak " + eLr(r.lr.reduce((a, b) => Math.max(a, b[1]), 0)), "lbl-s", "end") + (r.evt === "killed" ? S.cross(X(pts.at(-1)[0]), Y(pts.at(-1)[1]), 3.5) : "") };
      } },
      { key: "util", label: "GPU util", h: 56, y: { kind: "lin", lo: 0, hi: 100, ticks: [0, 50, 100], fmt: t => t + "%" }, tip: "GPU utilisation per 100 steps (faint) and per 500 (bold). Dips: evals every 500, checkpoint writes every 2k", draw: (c, X, Y) => {
        const m = []; for (let i = 0; i < r.sys.length; i += 5) { const w = r.sys.slice(i, i + 5); m.push([w.at(-1)[0], mean(w.map(p => p[1]))]); }
        return { clip: path(r.sys.map(p => [p[0], p[1]]), X, Y, "raw") + path(m, X, Y, "vl") };
      } },
      { key: "mem", label: "GPU mem", h: 44, y: { kind: "lin", lo: 0, hi: 80, ticks: [0, 40, 80], fmt: t => (t === 80 ? "80 GB" : String(t)) }, tip: "GPU memory of 80 GB", draw: (c, X, Y) => {
        const pts = r.sys.map(p => [p[0], p[2]]), d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
        return { clip: `<path d="${d}L${X(pts.at(-1)[0])} ${Y(0)}L${X(pts[0][0])} ${Y(0)}Z" class="spa"/><path d="${d}" class="spk"/>` };
      } },
    ],
    tip: (c, s) => {
      const tr = at(r.train, s), te = at(r.trainEma, s), v = at(r.val, s), lr = at(r.lr, s), sy = at(r.sys, s);
      if (s > r.steps) return `<b>step ${cStep(s)}</b><br>${statusText(r)}, no data`;
      const ck = r.ckpts.find(k => k.step === s);
      return `<table class="tt"><tr><th colspan="2">step ${cStep(s)}</th></tr>
        <tr><td>train</td><td>${f3(tr[1])}</td></tr><tr><td>train EMA</td><td>${f3(te[1])}</td></tr>
        ${v ? `<tr><td>val loss @${kStep(v[0])}</td><td>${f3(v[2])}</td></tr><tr><td>val top-1 @${kStep(v[0])}</td><td>${f4(v[1])}</td></tr>` : ""}
        <tr><td>lr</td><td>${lr[1].toExponential(2)}</td></tr>${sy ? `<tr><td>GPU</td><td>${sy[1]}%, ${sy[2]} GB</td></tr>` : ""}
        </table>${ck ? `<div style="margin-top:4px">checkpoint${ck.best ? ", best val" : ""}</div>` : ""}${r.evt && Math.abs(s - r.event.step) <= 300 ? `<div style="margin-top:2px">${esc(statusTip(r))}</div>` : ""}`;
    },
  });
}

/* ================================================================== routing, theme, palette */
const VIEWS = { task: renderTask, run: renderRun };
const REDRAW = { task: drawTaskCharts, run: drawRunCharts };
let current = "task", renderedRun = null, renderedTask = false;
function show() {
  const [v, arg] = (location.hash || "#task").slice(1).split("/");
  current = VIEWS[v] ? v : "task";
  if (current === "run" && arg && runByShort[arg]) SEL = runByShort[arg];
  Object.keys(VIEWS).forEach(k => ($("#v-" + k).hidden = k !== current));
  document.querySelectorAll(".tabs a").forEach(a => { if (a.getAttribute("href").split("/")[0] === "#" + current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("#runTab").setAttribute("href", "#run/" + short(SEL.run_id));
  if (current === "run") { if (renderedRun !== SEL) { renderRun(); renderedRun = SEL; } else drawRunCharts(); }
  else { if (!renderedTask) { renderTask(); renderedTask = true; } else { markSel(); renderSel(); drawTaskCharts(); } }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", show);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => REDRAW[current](), 120); });

function setThemeLabel() { $("#themeLbl").textContent = document.documentElement.dataset.theme === "dark" ? "Light" : "Dark"; }
function toggleTheme() {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; localStorage.setItem("hx-theme", t); setThemeLabel();
}
$("#themeBtn").addEventListener("click", toggleTheme);

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (c) { navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy).catch(() => {}); toast("Copied " + c.dataset.copy); return; }
  const t = e.target.closest("[data-toast]"); if (t) toast(t.dataset.toast);
});

/* tooltips: marks carry data-tip; stacked charts build theirs from the step under the cursor */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const st = e.target.closest && e.target.closest("[data-stack]");
  if (!st) document.querySelectorAll(".xh").forEach(x => (x.style.display = "none"));
  const t = !st && e.target.closest && e.target.closest("[data-tip]");
  let html = null;
  if (st) html = stackHover(e, st);
  else if (t && t.getAttribute("data-tip")) html = esc(t.getAttribute("data-tip")).replace(/\n/g, "<br>");
  if (!html) { tip.classList.remove("on"); return; }
  tip.innerHTML = html;
  const w = tip.offsetWidth || 300, hgt = tip.offsetHeight || 100;
  tip.style.left = (e.clientX + 16 + w > innerWidth ? e.clientX - w - 16 : e.clientX + 16) + "px";
  tip.style.top = Math.min(innerHeight - hgt - 8, e.clientY + 16) + "px";
  tip.classList.add("on");
});

const CMDS = [
  { g: "Go to", t: "Task", s: `${HX.project} / ${HX.task}`, go: () => (location.hash = "#task") },
  ...RUNS.map(r => ({ g: "Runs", t: short(r.run_id), s: `${CFG[r.config].name}, seed ${r.seed}, ${statusText(r)}`, go: () => (location.hash = "#run/" + short(r.run_id)) })),
  { g: "Commands", t: "Re-evaluate all runs", s: `${HX.metric.name} ${HX.metric.version}`, go: () => toast(`Re-evaluation queued for ${RUNS.length} runs`) },
  { g: "Commands", t: "Switch colour mode", s: "light or dark", go: toggleTheme },
];
let palItems = CMDS, palSel = 0;
function palRender() {
  let lastG = "", h = "";
  palItems.forEach((c, i) => {
    if (c.g !== lastG) { h += `<li class="grp" role="presentation">${esc(c.g)}</li>`; lastG = c.g; }
    h += `<li class="it" role="option" id="po${i}" data-i="${i}" aria-selected="${i === palSel}"><span>${esc(c.t)}</span><small>${esc(c.s)}</small></li>`;
  });
  $("#palList").innerHTML = h || `<li class="grp">No match. Try a run id or config.</li>`;
  $("#palIn").setAttribute("aria-activedescendant", "po" + palSel);
}
function palOpen() { $("#pal").classList.add("on"); $("#palIn").value = ""; palItems = CMDS; palSel = 0; palRender(); $("#palIn").focus(); }
function palClose() { $("#pal").classList.remove("on"); $("#findBtn").focus(); }
function palRun(i) { const c = palItems[i]; if (!c) return; palClose(); c.go(); }
$("#findBtn").addEventListener("click", palOpen);
$("#pal").addEventListener("click", e => { if (e.target.id === "pal") palClose(); const li = e.target.closest("li.it"); if (li) palRun(+li.dataset.i); });
$("#palIn").addEventListener("input", e => { const q = e.target.value.toLowerCase(); palItems = CMDS.filter(c => (c.t + " " + c.s + " " + c.g).toLowerCase().includes(q)); palSel = 0; palRender(); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#pal").classList.contains("on") ? palClose() : palOpen(); return; }
  if (!$("#pal").classList.contains("on")) return;
  if (e.key === "Escape") palClose();
  else if (e.key === "ArrowDown") { palSel = Math.min(palItems.length - 1, palSel + 1); palRender(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { palSel = Math.max(0, palSel - 1); palRender(); e.preventDefault(); }
  else if (e.key === "Enter") palRun(palSel);
});

setThemeLabel();
document.fonts.ready.then(show);
</script>
</body>
</html>

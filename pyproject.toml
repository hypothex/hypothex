[project]
name = "hypothex"
version = "0.1.0.dev0"
description = "Experiment tracker and control panel for AI researchers and their agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Shreyas Vinaya Sathyanarayana", email = "shreyas.college@gmail.com" }]
dependencies = [
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "typer>=0.12",
  "click>=8.2",
  "sqlalchemy>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psutil>=6.0",
  "xxhash>=3.4",
  "mcp>=2.0",
  "httpx>=0.27",
  "websockets>=17.1",
]

[project.urls]
Homepage = "https://github.com/hypothex/hypothex"

[project.scripts]
hx = "hypothex.cli.main:cli"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "ty",
  "scikit-learn>=1.5",
  "sphinx>=8.0",
  "sphinx-rtd-theme>=3.0",
  "numpydoc>=1.8",
  "hypothesis>=6.168.3",
  "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypothex"]
# The built UI (bun run build -> src/hypothex/ui_dist) is git-ignored. `artifacts`
# includes it when present and is a no-op when absent; `force-include` would fail
# the build ("Forced include not found") on a checkout without a UI build.
artifacts = ["src/hypothex/ui_dist/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/superpowers", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = [
  "docker: integration test against throwaway Docker containers (sshd, SLURM); run with -m docker",
]

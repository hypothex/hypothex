# Test cluster for Hypothex: login node `slurmctld`, one compute node `c1`.
ClusterName=hx
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmctldPort=6817
SlurmdPort=6818
MpiDefault=none
# containers: no cgroup plugins
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
# sacct needs accounting: slurmdbd backed by MariaDB
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
# sacct shows job comments only with this flag: Hypothex settles unknown submissions by them
AccountingStoreFlags=job_comment
JobCompType=jobcomp/none
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
# trust the node line below instead of the container's real hardware
SlurmdParameters=config_overrides
# a killed node comes back by itself; a job on a dead node stays NODE_FAIL (no requeue)
ReturnToService=2
JobRequeue=0
SlurmdTimeout=10
SlurmctldTimeout=30
InactiveLimit=0
MinJobAge=60
KillWait=5
Waittime=0
NodeName=c1 NodeAddr=c1 CPUs=2 RealMemory=1000 State=UNKNOWN
PartitionName=normal Nodes=c1 Default=YES MaxTime=INFINITE State=UP

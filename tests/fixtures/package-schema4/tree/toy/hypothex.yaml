{
  "project": "toy",
  "datasets": {
    "toyset": {
      "version": "v1",
      "path": "data/test.jsonl",
      "splits": {
        "test": "data/test.jsonl"
      }
    }
  },
  "metrics": {
    "accuracy": {
      "version": "v1",
      "fn": "toymetrics:accuracy"
    },
    "broken": {
      "version": "v1",
      "fn": "toymetrics:broken"
    },
    "up": {
      "version": "v1",
      "fn": "toymetrics:accuracy",
      "higher_is_better": true
    },
    "down": {
      "version": "v1",
      "fn": "toymetrics:accuracy",
      "higher_is_better": false
    },
    "latency": {
      "version": "v1",
      "fn": "toymetrics:accuracy"
    }
  },
  "tasks": {
    "toy-acc": {
      "dataset": "toyset",
      "split": "test",
      "metrics": [
        "accuracy"
      ],
      "primary": "accuracy"
    },
    "toy-broken": {
      "dataset": "toyset",
      "split": "test",
      "metrics": [
        "accuracy",
        "broken"
      ],
      "primary": "accuracy"
    },
    "direction": {
      "dataset": "toyset",
      "split": "test",
      "metrics": [
        "up",
        "down"
      ],
      "primary": "up"
    },
    "bench": {
      "kind": "system_bench",
      "dataset": "toyset",
      "split": "test",
      "metrics": [
        "latency"
      ],
      "primary": "latency/p95"
    },
    "matrix": {
      "dataset": "toyset",
      "split": "test",
      "metrics": [
        "accuracy"
      ],
      "primary": "accuracy/set-0.m-a.top1",
      "score_keys": "{dataset}.{model}.{metric}"
    }
  },
  "stages": {
    "infer": "__HX_FIXTURE_PYTHON__ infer.py --ckpt {checkpoint}"
  },
  "env": {
    "python": [
      "__HX_FIXTURE_PYTHON__"
    ]
  }
}
